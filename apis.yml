name: SpecCheck
description: >-
  SpecCheck (speccheckrx.com) is an optical lab ordering platform for eyecare
  practices and eyewear partners. Its REST API lets integrators authenticate
  with client credentials, list the labs a user is associated with, retrieve a
  lab's order settings, browse the lens catalog (styles, materials, and add-on
  coats, colors, and tints), and create prescription (rx), frame, redo, and
  multi-pair orders. The API uses 24-hour bearer tokens plus a User-Email actor
  header, an Idempotency-Key header for safe POST retries, cursor pagination on
  list endpoints, and a consistent error envelope. SpecCheck was surfaced as a
  portfolio company of Initialized Capital and enriched by the API Evangelist
  pipeline from its public documentation at docs.speccheckrx.com.
